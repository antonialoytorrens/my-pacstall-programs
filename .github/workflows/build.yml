name: Build .deb

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      package:
        description: Package to build (all = every package, or a package name)
        required: true
        default: all
        type: string

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.gen.outputs.build_matrix }}
      publish_matrix: ${{ steps.gen.outputs.publish_matrix }}
      has_builds: ${{ steps.gen.outputs.has_builds }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Discover packages to build
        id: gen
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PACKAGE: ${{ inputs.package }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          chmod +x scripts/discover.sh
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${INPUT_PACKAGE}" = "all" ] || [ -z "${INPUT_PACKAGE}" ]; then
              mapfile -t PKGS < <(./scripts/discover.sh list)
            else
              PKGS=("${INPUT_PACKAGE}")
            fi
          else
            mapfile -t PKGS < <(./scripts/discover.sh changed "${BEFORE_SHA}")
          fi

          if [ "${#PKGS[@]}" -eq 0 ]; then
            echo "No packages to build"
            echo "has_builds=false" >> "${GITHUB_OUTPUT}"
            echo "build_matrix=[]" >> "${GITHUB_OUTPUT}"
            echo "publish_matrix=[]" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "Packages: ${PKGS[*]}"
          BUILD="$(./scripts/discover.sh build-matrix "${PKGS[@]}")"
          PUBLISH="$(./scripts/discover.sh publish-matrix "${PKGS[@]}")"
          echo "has_builds=true" >> "${GITHUB_OUTPUT}"
          {
            echo "build_matrix<<EOF"
            echo "${BUILD}"
            echo "EOF"
            echo "publish_matrix<<EOF"
            echo "${PUBLISH}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.package }} (${{ matrix.distribution }} ${{ matrix.release_number }}, ${{ matrix.arch }})
    needs: discover
    if: needs.discover.outputs.has_builds == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.build_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        if: matrix.qemu
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        run: make "${{ matrix.target }}"

      - name: Tag artifacts with distribution/release
        if: matrix.multi_distro
        run: |
          suffix="${{ matrix.deb_suffix }}"
          shopt -s nullglob
          for f in ${{ matrix.package }}_*_${{ matrix.arch }}.deb ${{ matrix.package }}-*_*_all.deb; do
            [ -f "$f" ] || continue
            base="${f%.deb}"
            arch_part="${base##*_}"
            name_ver="${base%_*}"
            # skip if already tagged
            case "${name_ver}" in
              *"~${suffix}") continue ;;
            esac
            mv "$f" "${name_ver}~${suffix}_${arch_part}.deb"
          done
          ls -lh ./*.deb || true

      - name: Check artifacts
        run: |
          set -euo pipefail
          if [ "${{ matrix.multi_distro }}" = "true" ]; then
            suffix="~${{ matrix.deb_suffix }}"
            PKG="$(ls ${{ matrix.package }}_*${suffix}_${{ matrix.arch }}.deb)"
          else
            PKG="$(ls ${{ matrix.package }}_*_${{ matrix.arch }}.deb)"
          fi
          test -f "${PKG}"
          dpkg-deb -I "${PKG}" >/dev/null
          ls -lh "${PKG}"
          # Helper / split packages (Architecture: all), if any
          shopt -s nullglob
          if [ "${{ matrix.multi_distro }}" = "true" ]; then
            helpers=(${{ matrix.package }}-*_*~${{ matrix.deb_suffix }}_all.deb)
          else
            helpers=(${{ matrix.package }}-*_*_all.deb)
          fi
          for h in "${helpers[@]:-}"; do
            [ -f "$h" ] || continue
            dpkg-deb -I "$h" >/dev/null
            ls -lh "$h"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}-deb-${{ matrix.deb_suffix }}-${{ matrix.arch }}
          path: |
            ${{ matrix.package }}_*_${{ matrix.arch }}.deb
            ${{ matrix.package }}_*~${{ matrix.deb_suffix }}_${{ matrix.arch }}.deb

      - uses: actions/upload-artifact@v7
        if: matrix.arch == 'amd64'
        with:
          name: ${{ matrix.package }}-deb-${{ matrix.deb_suffix }}-all
          path: |
            ${{ matrix.package }}-*_*_all.deb
            ${{ matrix.package }}-*_*~${{ matrix.deb_suffix }}_all.deb
          if-no-files-found: ignore

  publish:
    needs: [discover, build]
    if: needs.discover.outputs.has_builds == 'true' && needs.build.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.publish_matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ matrix.package }}-deb-*
          merge-multiple: true

      - name: Publish ${{ matrix.package }} prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PACKAGE: ${{ matrix.package }}
        run: bash scripts/publish-prerelease.sh
