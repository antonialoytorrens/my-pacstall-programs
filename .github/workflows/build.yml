name: Build .deb

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      package:
        description: Package to build (all = every package)
        required: true
        default: all
        type: choice
        options:
          - all
          - gatus
          - glitchtip
          - weblate
          - wger
          - fail2ban-ui

permissions:
  contents: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      gatus: ${{ steps.set.outputs.gatus }}
      glitchtip: ${{ steps.set.outputs.glitchtip }}
      weblate: ${{ steps.set.outputs.weblate }}
      wger: ${{ steps.set.outputs.wger }}
      fail2ban-ui: ${{ steps.set.outputs.fail2ban-ui }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            gatus:
              - 'packages/gatus/**'
              - 'docker/gatus/**'
              - 'packagelist'
              - 'srclist'
              - 'Makefile'
              - 'settings.cfg'
              - 'scripts/publish-prerelease.sh'
              - '.github/workflows/build.yml'
            glitchtip:
              - 'packages/glitchtip/**'
              - 'docker/glitchtip/**'
              - 'packagelist'
              - 'srclist'
              - 'Makefile'
              - 'settings.cfg'
              - 'scripts/publish-prerelease.sh'
              - '.github/workflows/build.yml'
            weblate:
              - 'packages/weblate/**'
              - 'docker/weblate/**'
              - 'packagelist'
              - 'srclist'
              - 'Makefile'
              - 'settings.cfg'
              - 'scripts/publish-prerelease.sh'
              - '.github/workflows/build.yml'
            wger:
              - 'packages/wger/**'
              - 'docker/wger/**'
              - 'packagelist'
              - 'srclist'
              - 'Makefile'
              - 'settings.cfg'
              - 'scripts/publish-prerelease.sh'
              - '.github/workflows/build.yml'
            fail2ban-ui:
              - 'packages/fail2ban-ui/**'
              - 'docker/fail2ban-ui/**'
              - 'packagelist'
              - 'srclist'
              - 'Makefile'
              - 'settings.cfg'
              - 'scripts/publish-prerelease.sh'
              - '.github/workflows/build.yml'

      - name: Set package outputs
        id: set
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PACKAGE: ${{ inputs.package }}
          FILTER_GATUS: ${{ steps.filter.outputs.gatus }}
          FILTER_GLITCHTIP: ${{ steps.filter.outputs.glitchtip }}
          FILTER_WEBLATE: ${{ steps.filter.outputs.weblate }}
          FILTER_WGER: ${{ steps.filter.outputs.wger }}
          FILTER_FAIL2BAN_UI: ${{ steps.filter.outputs.fail2ban-ui }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            pkg="${INPUT_PACKAGE}"
            for name in gatus glitchtip weblate wger fail2ban-ui; do
              if [ "$pkg" = "all" ] || [ "$pkg" = "$name" ]; then
                echo "${name}=true" >> "${GITHUB_OUTPUT}"
              else
                echo "${name}=false" >> "${GITHUB_OUTPUT}"
              fi
            done
          else
            echo "gatus=${FILTER_GATUS:-false}" >> "${GITHUB_OUTPUT}"
            echo "glitchtip=${FILTER_GLITCHTIP:-false}" >> "${GITHUB_OUTPUT}"
            echo "weblate=${FILTER_WEBLATE:-false}" >> "${GITHUB_OUTPUT}"
            echo "wger=${FILTER_WGER:-false}" >> "${GITHUB_OUTPUT}"
            echo "fail2ban-ui=${FILTER_FAIL2BAN_UI:-false}" >> "${GITHUB_OUTPUT}"
          fi

  build-gatus:
    needs: changes
    if: needs.changes.outputs.gatus == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            qemu: false
          - arch: arm64
            runner: ubuntu-24.04-arm
            qemu: false
          - arch: armhf
            runner: ubuntu-latest
            qemu: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU
        if: matrix.qemu
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build gatus .deb (${{ matrix.arch }})
        run: make "gatus-${{ matrix.arch }}"
      - name: Check artifact
        run: |
          PKG="$(ls gatus_*_${{ matrix.arch }}.deb)"
          test -f "${PKG}"
          dpkg-deb -I "${PKG}" >/dev/null
          ls -lh "${PKG}"
          for helper in gatus-pgsql gatus-sqlite; do
            HELPER_PKG="$(ls ${helper}_*_all.deb)"
            test -f "${HELPER_PKG}"
            dpkg-deb -I "${HELPER_PKG}" >/dev/null
            ls -lh "${HELPER_PKG}"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: gatus-deb-${{ matrix.arch }}
          path: gatus_*_${{ matrix.arch }}.deb
      - uses: actions/upload-artifact@v7
        if: matrix.arch == 'amd64'
        with:
          name: gatus-deb-all
          path: |
            gatus-pgsql_*_all.deb
            gatus-sqlite_*_all.deb

  build-glitchtip:
    needs: changes
    if: needs.changes.outputs.glitchtip == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DEBIAN_FRONTEND: noninteractive
      GLITCHTIP_DOMAIN: ci.example.test
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build glitchtip .deb (amd64)
        run: make glitchtip-amd64
      - name: Check artifact
        run: |
          PKG="$(ls glitchtip_*.deb)"
          test -f "${PKG}"
          dpkg-deb -I "${PKG}" >/dev/null
          ls -lh "${PKG}"
      - uses: actions/upload-artifact@v7
        with:
          name: glitchtip-deb-amd64
          path: glitchtip_*_amd64.deb

  build-weblate:
    needs: changes
    if: needs.changes.outputs.weblate == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            qemu: false
          - arch: arm64
            runner: ubuntu-24.04-arm
            qemu: false
          - arch: armhf
            runner: ubuntu-latest
            qemu: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU
        if: matrix.qemu
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build weblate .deb (${{ matrix.arch }})
        run: make "weblate-${{ matrix.arch }}"
      - name: Check artifact
        run: |
          PKG="$(ls weblate_*_${{ matrix.arch }}.deb)"
          test -f "${PKG}"
          dpkg-deb -I "${PKG}" >/dev/null
          ls -lh "${PKG}"
      - uses: actions/upload-artifact@v7
        with:
          name: weblate-deb-${{ matrix.arch }}
          path: weblate_*_${{ matrix.arch }}.deb

  build-wger:
    needs: changes
    if: needs.changes.outputs.wger == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            qemu: false
          - arch: arm64
            runner: ubuntu-24.04-arm
            qemu: false
          - arch: armhf
            runner: ubuntu-latest
            qemu: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      DEBIAN_FRONTEND: noninteractive
      WGER_DOMAIN: ci.example.test
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU
        if: matrix.qemu
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build wger .deb (${{ matrix.arch }})
        run: make "wger-${{ matrix.arch }}"
      - name: Check artifact
        run: |
          PKG="$(ls wger_*_${{ matrix.arch }}.deb)"
          test -f "${PKG}"
          dpkg-deb -I "${PKG}" >/dev/null
          ls -lh "${PKG}"
      - uses: actions/upload-artifact@v7
        with:
          name: wger-deb-${{ matrix.arch }}
          path: wger_*_${{ matrix.arch }}.deb

  publish-gatus:
    needs: [changes, build-gatus]
    if: needs.changes.outputs.gatus == 'true' && needs.build-gatus.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: gatus-deb-*
          merge-multiple: true
      - name: Publish gatus prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PACKAGE: gatus
        run: bash scripts/publish-prerelease.sh

  publish-glitchtip:
    needs: [changes, build-glitchtip]
    if: needs.changes.outputs.glitchtip == 'true' && needs.build-glitchtip.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: glitchtip-deb-*
          merge-multiple: true
      - name: Publish glitchtip prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PACKAGE: glitchtip
        run: bash scripts/publish-prerelease.sh

  publish-weblate:
    needs: [changes, build-weblate]
    if: needs.changes.outputs.weblate == 'true' && needs.build-weblate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: weblate-deb-*
          merge-multiple: true
      - name: Publish weblate prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PACKAGE: weblate
        run: bash scripts/publish-prerelease.sh

  publish-wger:
    needs: [changes, build-wger]
    if: needs.changes.outputs.wger == 'true' && needs.build-wger.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: wger-deb-*
          merge-multiple: true
      - name: Publish wger prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PACKAGE: wger
        run: bash scripts/publish-prerelease.sh

  build-fail2ban-ui:
    needs: changes
    if: needs.changes.outputs.fail2ban-ui == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            qemu: false
          - arch: arm64
            runner: ubuntu-24.04-arm
            qemu: false
          - arch: armhf
            runner: ubuntu-latest
            qemu: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU
        if: matrix.qemu
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build fail2ban-ui .deb (${{ matrix.arch }})
        run: make "fail2ban-ui-${{ matrix.arch }}"
      - name: Check artifact
        run: |
          PKG="$(ls fail2ban-ui_*_${{ matrix.arch }}.deb)"
          test -f "${PKG}"
          dpkg-deb -I "${PKG}" >/dev/null
          ls -lh "${PKG}"
      - uses: actions/upload-artifact@v7
        with:
          name: fail2ban-ui-deb-${{ matrix.arch }}
          path: fail2ban-ui_*_${{ matrix.arch }}.deb

  publish-fail2ban-ui:
    needs: [changes, build-fail2ban-ui]
    if: needs.changes.outputs.fail2ban-ui == 'true' && needs.build-fail2ban-ui.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: fail2ban-ui-deb-*
          merge-multiple: true
      - name: Publish fail2ban-ui prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PACKAGE: fail2ban-ui
        run: bash scripts/publish-prerelease.sh
