name: Cleanup old prereleases

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      retention_days:
        description: Delete prereleases older than this many days
        required: true
        default: '30'
        type: string

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Delete prereleases older than retention
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RETENTION_DAYS: ${{ inputs.retention_days || '30' }}
        run: |
          chmod +x ./scripts/cleanup-old-prereleases.sh
          ./scripts/cleanup-old-prereleases.sh
