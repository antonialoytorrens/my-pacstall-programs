# Package build settings for my-pacstall-programs

PACKAGES := gatus glitchtip weblate wger fail2ban-ui

# Architectures per package (glitchtip is amd64-only)
GATUS_ARCHES         := amd64 arm64 armhf
GLITCHTIP_ARCHES     := amd64
WEBLATE_ARCHES       := amd64 arm64 armhf
WGER_ARCHES          := amd64 arm64 armhf
FAIL2BAN_UI_ARCHES   := amd64 arm64 armhf

# Docker Compose
COMPOSE := docker compose
SERVICE := pacstall-deb-builder

# Defaults for package-specific build-args
WGER_DOMAIN ?= wger.localhost.local
GLITCHTIP_DOMAIN ?= glitchtip.localhost.local
